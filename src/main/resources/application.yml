spring:
  application:
    name: zyclos-api

  profiles:
    default: dev

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

zyclos:
  jwt:
    # Em producao, defina ZYCLOS_JWT_SEGREDO com 32 bytes ou mais.
    segredo: ${ZYCLOS_JWT_SEGREDO:}
    minutos-de-validade: 720
    emissor: zyclos-api
  cors:
    origens-permitidas:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:3000
      - http://127.0.0.1:5173
  upload:
    diretorio: ${ZYCLOS_UPLOAD_DIR:dados/uploads}
    tamanho-maximo-bytes: 5242880
  seed:
    habilitado: true

logging:
  level:
    br.com.zyclos: INFO

---
# Desenvolvimento: banco H2 em arquivo, console web habilitado e dados de demonstracao.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./dados/zyclos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: zyclos
    password: zyclos
  h2:
    console:
      enabled: true
      path: /h2-console

zyclos:
  jwt:
    # Segredo fixo apenas para desenvolvimento, para que o token sobreviva a um reinicio.
    segredo: ${ZYCLOS_JWT_SEGREDO:zyclos-chave-de-desenvolvimento-nao-use-em-producao}

---
# Testes automatizados: banco em memoria, sem dados de demonstracao.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:zyclos-teste;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

zyclos:
  seed:
    habilitado: false
  jwt:
    segredo: zyclos-chave-de-teste-com-mais-de-trinta-e-dois-bytes

---
# Producao: PostgreSQL e segredo obrigatorio por variavel de ambiente.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${ZYCLOS_DB_URL:jdbc:postgresql://localhost:5432/zyclos}
    username: ${ZYCLOS_DB_USUARIO:zyclos}
    password: ${ZYCLOS_DB_SENHA:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

zyclos:
  seed:
    habilitado: false
  cors:
    origens-permitidas: ${ZYCLOS_CORS_ORIGENS:https://zyclos.app}
