spring.application.name=zyclos
server.port=8080
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=zyclos_db;integratedSecurity=false;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=@ITB123456
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect


# Informacoes:

# integratedSecurity: (true) Indica que a conexao sera feita com as credenciais do Windows (false) Credencial do SQL SERVER
# encrypt: (true) Requer criptografia do Cliente (false) Nao requer criptografia do Cliente
# trustServerCertificate: (true) Instrui o aplicativo cliente a ignorar a validacao do certificado SSL/TSL do servidor
# ddl-auto=none: as tabelas NAO sao criadas pelo Hibernate, rode antes o script docs/sql/zyclos_db.sql
