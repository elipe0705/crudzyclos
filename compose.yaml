services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zyclos
      POSTGRES_USER: zyclos
      POSTGRES_PASSWORD: zyclos
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyclos -d zyclos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      banco:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ZYCLOS_DB_URL: jdbc:postgresql://banco:5432/zyclos
      ZYCLOS_DB_USUARIO: zyclos
      ZYCLOS_DB_SENHA: zyclos
      # Troque por um valor proprio antes de publicar.
      ZYCLOS_JWT_SEGREDO: troque-este-segredo-por-um-valor-com-32-bytes-ou-mais
      ZYCLOS_CORS_ORIGENS: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - dados-uploads:/app/dados/uploads

volumes:
  dados-postgres:
  dados-uploads:
